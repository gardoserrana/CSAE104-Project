
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, 
    initial-scale=1">
    <title>Campus Notices</title>

    <style>
        .container {
            display: flex;
            flex-direction: row;
            background-color: white;
            align-items: center;
        }

        .container div {
            background-color: lightgray;
            border-radius: 40px;
            margin: 10px;
            padding: 20px;
            font-size: 24px;
            width: 400px;
        }

        header {
            display: flex;
            background-color: blueviolet;
            align-items: center;
            font-size: 24px;
            padding: 15px;
        }

        nav {
            background-color: lightblue;
            padding: 15px;
        }

        
    </style>
</head>

<body>

    <header>
        <img src="Unknown.png" width="60">
        Don Mariano Marcos Memorial State University
    </header>

    <nav>
        <a href="url">Home</a>
        <a href="url">About Us</a>
        <a href="url">Contact Us</a>
        <a href="url">Register</a>
    </nav>

    <main>
        <h1>Campus Notices</h1>

        <div class="container">

            <div>
                <h3>Login Form</h3>

                <table>
                    <tr>
                        <td>Username</td>
                        <td><input type="text" name="username"></td>
                    </tr>

                    <tr>
                        <td>Password</td>
                        <td><input type="password" name="password"></td>
                    </tr>
                </table>

                <button type="button">Login</button>
                <button type="button">Cancel</button>
                
            </div>

            <div>
                <img src="Unknown.png"  width="170">
            </div>

        </div>
    </main>

    <footer>College of computer science</footer>

</body>
</html>
